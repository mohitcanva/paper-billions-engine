<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Tied Top Frill / Neck Flaps -->
  <path d="M 75 75 C 65 45, 55 40, 60 25 C 75 35, 90 45, 100 50 C 110 45, 125 35, 140 25 C 145 40, 135 45, 125 75 Z"
        fill="#EAB308" stroke="#1E293B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Rope Tie -->
  <path d="M 68 76 C 88 84, 112 84, 132 76"
        stroke="#78350F" stroke-width="8" stroke-linecap="round"/>
  <circle cx="100" cy="80" r="7" fill="#92400E" stroke="#1E293B" stroke-width="3"/>
  <!-- Dangling Rope Ends -->
  <path d="M 97 84 C 95 95, 90 102, 92 110" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
  <path d="M 103 84 C 108 95, 114 100, 112 112" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>

  <!-- Main Plump Sack Body -->
  <path d="M 70 80
           C 40 100, 25 145, 30 180
           C 35 210, 60 225, 100 225
           C 140 225, 165 210, 170 180
           C 175 145, 160 100, 130 80
           Z"
        fill="#FACC15" stroke="#1E293B" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Shadow Fold Arc -->
  <path d="M 45 185 C 55 210, 85 218, 100 218 C 120 218, 145 210, 155 185"
        stroke="#CA8A04" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Iconic Dollar Sign Badge -->
  <g transform="translate(100, 155)">
    <!-- Dollar sign background badge circle -->
    <circle cx="0" cy="0" r="34" fill="#FEF08A" stroke="#1E293B" stroke-width="4"/>
    <!-- Big Bold $ Text / Path -->
    <text x="0" y="16" font-family="'Impact', 'Arial Black', sans-serif" font-size="48" font-weight="900"
          fill="#16A34A" stroke="#1E293B" stroke-width="3" text-anchor="middle">$</text>
  </g>
</svg>
